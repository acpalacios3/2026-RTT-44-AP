<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal-Blog-SBA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container mt-2  ">
        <h1 class=" mb-4">Interactive Personal Blog</h1>
        <div class=" card p-4 mb-2">
            <h2>Create Post</h2>

            <form id="postForm" novalidate>

                        <div class="d-flex align-items-center mb-1">
                            <label for="postTitle" class="form-label">Post Title:</label>
                            <input id="postTitle" type="text" class="form-control w-50" placeholder="Enter post Title"
                            required>
                             <span id="titleError" class="error-message"></span>
                        </div>

                        <div class="d-flex align-items-center mb-1">
                            <label for="postContent"  class="form-label">Post Content:</label>
                            <textarea id="postContent" class="form-control" rows="5" placeholder=" Post Content" required>
                             </textarea>
                             <span id="contentError" class="error-message"></span>
                        </div>
                  
                     <button id="submit" type="submit" id="submitButton"  class="btn btn-primary"> 
                    Add Post
                    </button>

                    <button id="clearButton" class="btn btn-danger mt-3">
                        Clear Tasks
                    </button>
                                     
            </form>
        </div>

        <div>

            <h2 class="h4 mb-3">Blog Posts</h2>
            <div id="postList"></div>


        </div>

    </div>    

</body>

</html>
